<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah Makan Koto Indah - Masakan Padang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-stone-50 text-stone-800 antialiased flex flex-col min-h-screen">

    <!-- Status Bar -->
    <div class="bg-red-900 text-amber-100 text-xs py-2 px-4 text-center font-medium flex items-center justify-between z-50">
        <span>📍 Rumah Makan Koto Indah | Buka Setiap Hari</span>
        <div id="realtime-status" class="bg-stone-900 px-3 py-0.5 rounded-full text-emerald-400 font-bold">
            Memuat Koneksi...
        </div>
    </div>

    <!-- Header / Navbar -->
    <nav class="bg-stone-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-amber-400">RM KOTO INDAH</h1>
        <button onclick="toggleAdminModal()" class="text-xs bg-amber-500 text-stone-900 px-3 py-1.5 rounded-lg font-bold">
            <i class="fa-solid fa-lock"></i> Admin / Pemilik Resto
        </button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 flex-grow w-full">
        <div class="text-center my-6">
            <h2 class="text-3xl font-extrabold text-stone-900">Daftar Menu Realtime</h2>
            <p class="text-stone-500 text-sm">Menu di bawah langsung tersinkronisasi dari database Firestore.</p>
        </div>

        <!-- Container Menu -->
        <div id="daftar-menu" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Data akan masuk otomatis secara realtime di sini -->
            <p class="col-span-full text-center text-stone-400 py-10">Menghubungkan ke database...</p>
        </div>
    </main>

    <!-- ADMIN MODAL TAMBAH MENU -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg">Tambah Menu Baru</h3>
                <button onclick="toggleAdminModal()" class="text-stone-400 hover:text-stone-700 font-bold text-lg">✕</button>
            </div>
            
            <form id="add-form" onsubmit="tambahMenuBaru(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold mb-1">Nama Menu</label>
                    <input type="text" id="input-nama" required placeholder="Contoh: Rendang Sapi" class="w-full p-2 border rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Harga (Angka Saja)</label>
                    <input type="number" id="input-harga" required placeholder="25000" class="w-full p-2 border rounded-xl text-xs">
                </div>
                <button type="submit" class="w-full py-2.5 bg-red-700 text-white font-bold rounded-xl text-xs">
                    Simpan ke Firestore
                </button>
            </form>
        </div>
    </div>

    <!-- FIREBASE & REALTIME SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDljEqgDOct5I1ot1IFuP0OdAfUHbPgeiY",
            authDomain: "koto-indah-menu.firebaseapp.com",
            projectId: "koto-indah-menu",
            storageBucket: "koto-indah-menu.firebasestorage.app",
            messagingSenderId: "91344526030",
            appId: "1:91344526030:web:48347b0c3ee3a06ff8ce9f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ambil data secara Realtime menggunakan onSnapshot dari collection "menu"
        const container = document.getElementById("daftar-menu");
        const statusBadge = document.getElementById("realtime-status");

        onSnapshot(collection(db, "menu"), (snapshot) => {
            statusBadge.innerText = "Realtime Active";
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p class="col-span-full text-center text-stone-400">Belum ada menu di database.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const card = document.createElement("div");
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-lg text-stone-900">${item.nama || 'Tanpa Nama'}</h3>
                        <p class="text-red-700 font-extrabold text-base mt-1">Rp ${Number(item.harga || 0).toLocaleString('id-ID')}</p>
                    </div>
                    <span class="mt-4 text-[10px] bg-emerald-100 text-emerald-800 px-2 py-1 rounded w-fit font-bold">Ready / Tersedia</span>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error(error);
            statusBadge.innerText = "Disconnected";
            statusBadge.className = "bg-stone-900 px-3 py-0.5 rounded-full text-red-400 font-bold";
        });

        // Fungsi Tambah Menu
        window.tambahMenuBaru = async function(e) {
            e.preventDefault();
            const nama = document.getElementById("input-nama").value;
            const harga = Number(document.getElementById("input-harga").value);

            try {
                await addDoc(collection(db, "menu"), { nama, harga });
                alert("Menu berhasil ditambahkan secara realtime!");
                document.getElementById("add-form").reset();
                toggleAdminModal();
            } catch (err) {
                alert("Gagal menyimpan: " + err.message);
            }
        };

        window.toggleAdminModal = function() {
            const modal = document.getElementById("admin-modal");
            modal.classList.toggle("hidden");
        };
    </script>
</body>
</html>
